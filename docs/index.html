<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="Nico Vale's travel journal, told through posted stops and reels.">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Where I've been · Nico Vale</title>
<style>
@font-face{font-family:'Cormorant Garamond';src:url('fonts/cormorant-garamond-italic-latin.woff2') format('woff2');font-style:italic;font-weight:600;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

@font-face{font-family:Caveat;src:url('fonts/caveat-latin-ext.woff2') format('woff2');font-style:normal;font-weight:500 600;font-display:swap;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:Karla;src:url('fonts/karla-latin.woff2') format('woff2');font-style:normal;font-weight:400 600;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Karla;src:url('fonts/karla-latin-ext.woff2') format('woff2');font-style:normal;font-weight:400 600;font-display:swap;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{color-scheme:light;--paper:#F3EBDC;--map:#F8F2E6;--border:#D9CCB3;--ink:#24323F;--hand:#8A5A3B;--red:#B4472E;--muted:#6B5B45;--white:#FFFDF8;font-family:Karla,Arial,sans-serif;color:var(--ink);background:var(--paper);font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}html{min-width:320px;overflow-x:hidden}body{margin:0;background:var(--paper)}main{width:min(100%,430px);margin:0 auto;padding:28px 20px 24px}.masthead{display:flex;flex-direction:column;gap:5px}.eyebrow{margin:0;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}.title{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:48px;line-height:1;letter-spacing:-.01em}.tagline{margin:2px 0 0;color:var(--hand);font-family:Caveat,cursive;font-size:24px;font-weight:500;line-height:1.15}
.map-card{position:relative;width:100%;height:400px;margin:9px 0 0;background:var(--map);border:1px solid var(--border);box-shadow:0 1px 0 #E5D9C2,0 8px 18px rgba(80,60,30,.10);transform:rotate(-.6deg);isolation:isolate}.map-stage{position:absolute;inset:0;overflow:hidden}.map{display:block;width:100%;height:100%;background:transparent}.tape{position:absolute;z-index:5;top:-9px;width:64px;height:20px;background:rgba(214,196,160,.75);pointer-events:none}.tape-left{left:22px;transform:rotate(-4deg)}.tape-right{right:26px;width:58px;transform:rotate(5deg)}.journey-note{position:absolute;left:17px;bottom:17px;color:var(--hand);font:600 22px/1 Caveat,cursive;transform:rotate(-.2deg);pointer-events:none}.country-stamps{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:row-reverse;align-items:flex-end;pointer-events:none}.stamp{width:78px;height:78px;margin-left:-25px;border:2px solid var(--red);border-radius:50%;box-shadow:inset 0 0 0 4px var(--map),inset 0 0 0 5px var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg);color:var(--red);opacity:.88;text-align:center;background:var(--map);padding:5px}.stamp-country{font-size:8px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}.stamp-entered{font:500 15px/1.05 Caveat,cursive}.stamp-day{font-size:8px;font-weight:600;letter-spacing:.08em}.map-label{font-family:Caveat,cursive;paint-order:stroke;stroke:#F8F2E6;stroke-width:.8px;stroke-linejoin:round;pointer-events:none}.start-label{fill:#6B5B45;font-size:4.6px}.latest-place{fill:#B4472E;font-size:6.2px;font-weight:600}.latest-day{fill:#8A5A3B;font-size:4.4px}.map-note{position:absolute;z-index:6;right:12px;left:12px;bottom:12px;max-height:52%;overflow:auto;padding:13px 15px 14px;background:#FFFDF8f5;border:1px solid var(--border);box-shadow:0 4px 14px rgba(80,60,30,.16);transform:rotate(.2deg)}.map-note[hidden]{display:none}.note-close{position:absolute;right:5px;top:3px;width:44px;height:44px;border:0;background:transparent;color:var(--muted);font-size:25px;cursor:pointer}.note-title{margin:0 45px 6px 0;color:var(--red);font:600 22px/1 Caveat,cursive}.note-entry{padding-top:7px;border-top:1px solid #E8DDC9}.note-entry:first-of-type{border-top:0}.note-day{margin:0;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}.note-spot{margin:3px 0;color:var(--ink);font-size:14px;line-height:1.35;overflow-wrap:anywhere}.note-place{margin:0;color:var(--muted);font-size:12px}.note-link{display:inline-flex;align-items:center;min-height:44px;margin-top:3px;color:var(--hand);font-size:13px;font-weight:600;text-underline-offset:3px}.note-draft{margin:4px 0;color:var(--muted);font-size:12px;font-style:italic}
.stats{margin:12px 0 10px;color:var(--ink);font:500 21px/1.25 Caveat,cursive}.reels-heading{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--border);padding-top:11px}.reels-title{margin:0;font:italic 600 27px/1 'Cormorant Garamond',Georgia,serif}.swipe{margin:0;color:var(--hand);font:500 18px/1 Caveat,cursive}.reels{display:flex;gap:14px;overflow-x:auto;overscroll-behavior-inline:contain;scroll-snap-type:x mandatory;padding:12px 4px 16px 2px;margin:0 -20px 0 0;scrollbar-width:thin;scrollbar-color:#C9B99C transparent}.reel{flex:0 0 138px;min-width:138px;min-height:44px;padding:8px 8px 10px;background:var(--white);box-shadow:0 3px 10px rgba(80,60,30,.14);text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px;scroll-snap-align:start;transform:rotate(-2deg)}.reel:nth-child(even){transform:rotate(1.5deg)}.reel:nth-child(3n){transform:rotate(-1deg)}.reel:focus-visible,.note-link:focus-visible,.note-close:focus-visible{outline:2px solid var(--red);outline-offset:3px}.cover{display:block;width:100%;height:168px;object-fit:cover;background:#DCCFB6}.reel-caption{margin:0;font:500 19px/1 Caveat,cursive;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.latest-badge{min-height:14px;color:var(--red);font-size:10px;font-weight:600;letter-spacing:.08em}.reel:not([data-latest=true]) .latest-badge{visibility:hidden}.reels-empty{margin:10px 0 18px;color:var(--muted);font-size:13px;line-height:1.5}footer{border-top:1px solid var(--border);margin-top:10px;padding:15px 0 0;color:var(--muted);font-size:12px;line-height:1.5}
@media(max-width:380px){main{padding-left:18px;padding-right:18px}.title{font-size:46px}.map-card{height:400px}.reels{margin-right:-18px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
<header class="masthead"><p class="eyebrow">NICO VALE · ON THE ROAD</p><h1 class="title">Where I've been</h1><p class="tagline">the map draws itself as I go.</p></header>
<section class="map-card" aria-label="Travel journal map">
  <span class="tape tape-left" aria-hidden="true"></span><span class="tape tape-right" aria-hidden="true"></span>
  <div class="map-stage"><svg id="map" class="map" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Trail map"></svg></div>
  <p id="journey-note" class="journey-note" hidden>The journey starts soon.</p>
  <div id="country-stamps" class="country-stamps" aria-label="Countries entered"></div>
  <aside id="map-note" class="map-note" aria-live="polite" aria-label="Travel journal note" hidden><button id="note-close" class="note-close" type="button" aria-label="Close note">×</button><div id="note-content"></div></aside>
</section>
<p id="stats" class="stats" hidden></p>
<section aria-labelledby="reels-title"><div class="reels-heading"><h2 id="reels-title" class="reels-title">Recent reels</h2><p class="swipe">swipe →</p></div><div id="reels" class="reels" aria-label="All posted reels"></div><p id="reels-empty" class="reels-empty" hidden>Reels will appear here after they are posted.</p></section>
<footer>Nico Vale is an AI character. The places are real.</footer>
</main>
<script>
'use strict';
const NS='http://www.w3.org/2000/svg';
const svgEl=(tag,attrs={})=>{const node=document.createElementNS(NS,tag);for(const [key,value] of Object.entries(attrs))node.setAttribute(key,String(value));return node;};
const day=n=>String(n).padStart(3,'0');
const esc=(value)=>String(value??'');
const keyOf=s=>`${s.place}\u0000${s.country}`;
function safeUrl(value){try{const u=new URL(value);return u.protocol==='https:'&&u.hostname==='www.instagram.com'&&/^\/(reel|p)\/[A-Za-z0-9_-]+\/?$/.test(u.pathname)?u.href:null}catch{return null}}
function pathFor(points,index){const p0=points[Math.max(0,index-1)],p1=points[index],p2=points[index+1],p3=points[Math.min(points.length-1,index+2)];const c1={x:p1.x+(p2.x-p0.x)/6,y:p1.y+(p2.y-p0.y)/6},c2={x:p2.x-(p3.x-p1.x)/6,y:p2.y-(p3.y-p1.y)/6};return `M${p1.x},${p1.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${p2.x},${p2.y}`}
function makeViewBox(points){const fallback={x:20,y:775,w:150,h:184};if(!points.length)return fallback;const xs=points.map(p=>p.x),ys=points.map(p=>p.y),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),spanX=maxX-minX,spanY=maxY-minY;if(spanX<110&&spanY<140)return fallback;let w=Math.max(150,spanX+32),h=Math.max(184,spanY+36);const aspect=335/400;if(w/h<aspect)w=h*aspect;else h=w/aspect;return{x:(minX+maxX-w)/2,y:(minY+maxY-h)/2,w,h}}
function addBase(svg,base){for(const node of [...base.children])svg.append(document.importNode(node,true))}
function showNote(records){const content=document.getElementById('note-content');content.replaceChildren();const title=document.createElement('h3');title.className='note-title';title.textContent=`${records[0].place} · ${records.length===1?'journal note':`${records.length} reels`}`;content.append(title);for(const stop of records){const entry=document.createElement('div');entry.className='note-entry';const d=document.createElement('p');d.className='note-day';d.textContent=`Day ${day(stop.day)}`;const spot=document.createElement('p');spot.className='note-spot';spot.textContent=esc(stop.spot);const loc=document.createElement('p');loc.className='note-place';loc.textContent=`${stop.place}, ${stop.country}`;entry.append(d,spot,loc);const url=safeUrl(stop.post_url);if(url){const link=document.createElement('a');link.className='note-link';link.href=url;link.target='_blank';link.rel='noopener noreferrer';link.referrerPolicy='no-referrer';link.textContent='Watch the reel →';entry.append(link)}else{const draft=document.createElement('p');draft.className='note-draft';draft.textContent='Private preview · not posted';entry.append(draft)}content.append(entry)}document.getElementById('map-note').hidden=false;document.getElementById('note-close').focus({preventScroll:true})}
function addStamps(stops){const firstByCountry=new Map();for(const stop of [...stops].sort((a,b)=>a.day-b.day))if(!firstByCountry.has(stop.country))firstByCountry.set(stop.country,stop.day);const recent=[...firstByCountry].slice(-3).reverse();const target=document.getElementById('country-stamps');for(const [country,firstDay]of recent){const stamp=document.createElement('div');stamp.className='stamp';stamp.style.zIndex=String(3-recent.findIndex(([name])=>name===country));stamp.setAttribute('aria-label',`${country}, entered Day ${day(firstDay)}`);for(const [cls,value]of [['stamp-country',country],['stamp-entered','entered'],['stamp-day',`DAY ${day(firstDay)}`]]){const line=document.createElement('span');line.className=cls;line.textContent=value;stamp.append(line)}target.append(stamp)}}
function addReels(stops,latest){const root=document.getElementById('reels');const ordered=[...stops].sort((a,b)=>b.day-a.day);for(const stop of ordered){const url=safeUrl(stop.post_url),item=document.createElement(url?'a':'article');item.className='reel';item.setAttribute('data-latest',String(stop.day===latest.day&&stop.place===latest.place&&stop.post_url===latest.post_url));if(url){item.href=url;item.target='_blank';item.rel='noopener noreferrer';item.referrerPolicy='no-referrer';item.setAttribute('aria-label',`Watch the reel: Day ${day(stop.day)}, ${stop.place}`)}const cover=document.createElement('img');cover.className='cover';cover.src=`covers/day-${day(stop.day)}.webp`;cover.width=122;cover.height=168;cover.loading=ordered.indexOf(stop)<3?'eager':'lazy';cover.alt='';const caption=document.createElement('p');caption.className='reel-caption';caption.textContent=`Day ${day(stop.day)} · ${stop.place}`;const badge=document.createElement('span');badge.className='latest-badge';badge.textContent='LATEST';item.append(cover,caption,badge);root.append(item)}if(!ordered.length)document.getElementById('reels-empty').hidden=false}
function draw(data,base){const svg=document.getElementById('map');const path=Array.isArray(data.path)?data.path:[],stops=Array.isArray(data.stops)?data.stops:[],latest=data.latest||null,view=makeViewBox(path);svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);svg.setAttribute('preserveAspectRatio','xMidYMid meet');addBase(svg,base);const defs=svgEl('defs'),filter=svgEl('filter',{id:'ink-wobble',x:'-5%',y:'-5%',width:'110%',height:'110%'}),noise=svgEl('feTurbulence',{type:'fractalNoise',baseFrequency:'.9',numOctaves:'2',seed:'4'}),displace=svgEl('feDisplacementMap',{in:'SourceGraphic',scale:'.9'});filter.append(noise,displace);defs.append(filter);svg.prepend(defs);
for(let i=0;i<path.length-1;i++){const line=svgEl('path',{d:pathFor(path,i),class:`trail-line${path[i+1].ferry?' ferry':''}`,'aria-hidden':'true'});line.setAttribute('fill','none');line.setAttribute('stroke','#24323F');line.setAttribute('stroke-width','.85');line.setAttribute('stroke-linecap','round');line.setAttribute('stroke-linejoin','round');line.setAttribute('filter','url(#ink-wobble)');if(path[i+1].ferry)line.setAttribute('stroke-dasharray','2.2 1.8');svg.append(line)}
const grouped=new Map();for(const stop of stops){const key=keyOf(stop);if(!grouped.has(key))grouped.set(key,[]);grouped.get(key).push(stop)}for(const records of grouped.values()){records.sort((a,b)=>b.day-a.day);const s=records[0],isLatest=latest&&s.place===latest.place&&s.country===latest.country,g=svgEl('g',{class:'town-dot',role:'button',tabindex:'0','aria-label':`${s.place}, ${s.country}, ${records.length} posted ${records.length===1?'reel':'reels'}`});const hit=svgEl('circle',{cx:s.x,cy:s.y,r:'1',fill:'transparent'}),marker=svgEl('circle',{cx:s.x,cy:s.y,r:'1.35',fill:isLatest?'#B4472E':'#F8F2E6',stroke:isLatest?'#B4472E':'#24323F','stroke-width':'.45'});g.append(hit,marker);if(isLatest)g.append(svgEl('circle',{cx:s.x,cy:s.y,r:'4.6',fill:'none',stroke:'#B4472E','stroke-width':'.45',filter:'url(#ink-wobble)'}));g.addEventListener('click',()=>showNote(records));g.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();showNote(records)}});g.hit=hit;svg.append(g)}
if(path.length&&stops.length){const start=stops.reduce((a,b)=>a.day<b.day?a:b),label=svgEl('text',{x:start.x-17,y:start.y+9,class:'map-label start-label'});label.textContent=`${start.place} · Day ${day(start.day)}`;svg.append(label)}if(latest){const label=svgEl('text',{x:latest.x+6,y:latest.y-2,class:'map-label latest-place'});label.textContent=latest.place;const sub=svgEl('text',{x:latest.x+6,y:latest.y+3,class:'map-label latest-day'});sub.textContent=`Day ${day(latest.day)}`;svg.append(label,sub)}
const resize=()=>{const rect=svg.getBoundingClientRect(),scale=Math.min(rect.width/view.w,rect.height/view.h);for(const g of svg.querySelectorAll('.town-dot'))g.hit.setAttribute('r',22/scale)};new ResizeObserver(resize).observe(svg);resize();
if(latest){const towns=new Set(stops.map(s=>keyOf(s))).size,countries=new Set(stops.map(s=>s.country)).size,stats=document.getElementById('stats');stats.textContent=`Day ${latest.day} · ${towns} ${towns===1?'town':'towns'} · ${countries} ${countries===1?'country':'countries'} so far`;stats.hidden=false;addStamps(stops);addReels(stops,latest)}else{document.getElementById('journey-note').hidden=false;document.getElementById('stats').hidden=true;document.getElementById('swipe')?.remove();document.querySelector('.swipe').hidden=true;document.getElementById('reels-empty').hidden=false}}
async function load(){const [trailResponse,baseResponse]=await Promise.all([fetch('trail.json',{cache:'no-store'}),fetch('basemap.svg',{cache:'no-store'})]);if(!trailResponse.ok||!baseResponse.ok)throw new Error('Trail files unavailable');const data=await trailResponse.json(),xml=new DOMParser().parseFromString(await baseResponse.text(),'image/svg+xml');if(xml.querySelector('parsererror'))throw new Error('Invalid base map');draw(data,xml.documentElement)}
document.getElementById('note-close').addEventListener('click',()=>{document.getElementById('map-note').hidden=true});
load().catch(()=>{document.getElementById('journey-note').hidden=false;document.getElementById('reels-empty').textContent='The trail is temporarily unavailable.';document.getElementById('reels-empty').hidden=false;document.getElementById('swipe').hidden=true});
</script>
</body>
</html>
