<!doctype html>
<html lang="en">
<head>

<meta name="description" content="Nico Vale's travel journal, told through posted stops and reels.">

<title>Places with Nico · Nico Vale</title>
<style>

@font-face{font-family:Caveat;src:url('fonts/caveat-latin-ext.woff2') format('woff2');font-style:normal;font-weight:500 600;font-display:swap;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}

@font-face{font-family:Karla;src:url('fonts/karla-latin-ext.woff2') format('woff2');font-style:normal;font-weight:400 600;font-display:swap;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{color-scheme:light;--paper:#F3EBDC;--map:#F8F2E6;--border:#D9CCB3;--ink:#24323F;--hand:#8A5A3B;--red:#B4472E;--muted:#6B5B45;--white:#FFFDF8;font-family:Karla,Arial,sans-serif;color:var(--ink);background:var(--paper);font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}html{min-width:320px;overflow-x:hidden}body{margin:0;background:var(--paper)}main{width:min(100%,430px);margin:0 auto;padding:28px 20px 24px}.masthead{display:flex;flex-direction:column;gap:5px}.eyebrow{margin:0;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}.title{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:48px;line-height:1;letter-spacing:-.01em}.tagline{margin:2px 0 0;color:var(--hand);font-family:Caveat,cursive;font-size:24px;font-weight:500;line-height:1.15}
.map-card{position:relative;width:100%;height:400px;margin:9px 0 0;background:var(--map);border:1px solid var(--border);box-shadow:0 1px 0 #E5D9C2,0 8px 18px rgba(80,60,30,.10);transform:rotate(-.6deg);isolation:isolate}.map-stage{position:absolute;inset:0;overflow:hidden}.map{display:block;width:100%;height:100%;background:transparent}.tape{position:absolute;z-index:5;top:-9px;width:64px;height:20px;background:rgba(214,196,160,.75);pointer-events:none}.tape-left{left:22px;transform:rotate(-4deg)}.tape-right{right:26px;width:58px;transform:rotate(5deg)}.journey-note{position:absolute;left:17px;bottom:17px;color:var(--hand);font:600 22px/1 Caveat,cursive;transform:rotate(-.2deg);pointer-events:none}.country-stamps{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:row-reverse;align-items:flex-end;pointer-events:none}.stamp{width:78px;height:78px;margin-left:-25px;border:2px solid var(--red);border-radius:50%;box-shadow:inset 0 0 0 4px var(--map),inset 0 0 0 5px var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg);color:var(--red);opacity:.88;text-align:center;background:var(--map);padding:5px}.stamp-country{font-size:8px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}.stamp-entered{font:500 15px/1.05 Caveat,cursive}.stamp-day{font-size:8px;font-weight:600;letter-spacing:.08em}.map-label{font-family:Caveat,cursive;paint-order:stroke;stroke:#F8F2E6;stroke-width:.8px;stroke-linejoin:round;pointer-events:none}.start-label{fill:#6B5B45;font-size:4.6px}.latest-place{fill:#B4472E;font-size:6.2px;font-weight:600}.latest-day{fill:#8A5A3B;font-size:4.4px}.map-note{position:absolute;z-index:6;right:12px;left:12px;bottom:12px;max-height:65%;overflow:auto;padding:13px 15px 14px;background:#FFFDF8f5;border:1px solid var(--border);box-shadow:0 4px 14px rgba(80,60,30,.16);transform:rotate(.2deg)}.map-note[hidden]{display:none}.note-close{position:absolute;right:2px;top:2px;width:44px;height:44px;border:0;background:transparent;color:var(--ink);font:400 26px/1 Karla,Arial,sans-serif;display:grid;place-items:center;cursor:pointer;border-radius:50%}.note-title{margin:0 45px 6px 0;color:var(--red);font:600 22px/1 Caveat,cursive}.visit-choice{min-height:44px;padding:6px 10px;border:1px solid var(--border);background:var(--white);color:var(--hand);font:600 14px Karla,Arial,sans-serif;cursor:pointer}.visit-choice:focus-visible{outline:2px solid var(--red);outline-offset:2px}footer a{color:inherit;text-underline-offset:2px}.note-entry{padding-top:7px;border-top:1px solid #E8DDC9}.note-entry:first-of-type{border-top:0}.note-day{margin:0;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}.note-spot{margin:3px 0;color:var(--ink);font-size:14px;line-height:1.35;overflow-wrap:anywhere}.note-place{margin:0;color:var(--muted);font-size:12px}.note-link{display:inline-flex;align-items:center;min-height:44px;margin-top:3px;color:var(--hand);font-size:13px;font-weight:600;text-underline-offset:3px}.note-draft{margin:4px 0;color:var(--muted);font-size:12px;font-style:italic}
.stats{margin:12px 0 10px;color:var(--ink);font:500 21px/1.25 Caveat,cursive}.reels-heading{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--border);padding-top:11px}.reels-title{margin:0;font:italic 600 27px/1 'Cormorant Garamond',Georgia,serif}.swipe{margin:0;color:var(--hand);font:500 18px/1 Caveat,cursive}.reels{display:flex;gap:14px;overflow-x:auto;overscroll-behavior-inline:contain;scroll-snap-type:x mandatory;padding:12px 4px 16px 2px;margin:0 -20px 0 0;scrollbar-width:thin;scrollbar-color:#C9B99C transparent}.reel{flex:0 0 138px;min-width:138px;height:266px;min-height:44px;padding:8px 8px 10px;background:var(--white);box-shadow:0 3px 10px rgba(80,60,30,.14);text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px;scroll-snap-align:start;transform:rotate(-2deg)}.reel:nth-child(even){transform:rotate(1.5deg)}.reel:nth-child(3n){transform:rotate(-1deg)}.reel:focus-visible,.note-link:focus-visible{outline:2px solid var(--red);outline-offset:3px}.note-close:focus-visible{outline:0;box-shadow:inset 0 0 0 2px var(--ink)}.cover{display:block;width:100%;height:168px;object-fit:cover;background:#DCCFB6}.reel-caption{display:flex;flex:0 0 54px;height:54px;flex-direction:column;gap:1px;margin:0;font-family:Caveat,cursive}.reel-day{color:var(--hand);font-size:14px;font-weight:500;line-height:1}.reel-place{flex:0 0 38px;height:38px;min-height:38px;max-height:38px;overflow:hidden;color:var(--ink);font-size:18px;font-weight:600;line-height:1;overflow-wrap:anywhere}.latest-badge{display:block;height:14px;min-height:14px;flex:0 0 14px;line-height:14px;color:var(--red);font-size:10px;font-weight:600;letter-spacing:.08em}.reel:not([data-latest=true]) .latest-badge{visibility:hidden}.reels-empty{margin:10px 0 18px;color:var(--muted);font-size:13px;line-height:1.5}footer{border-top:1px solid var(--border);margin-top:10px;padding:15px 0 0;color:var(--muted);font-size:12px;line-height:1.5}
@media(max-width:380px){main{padding-left:18px;padding-right:18px}.title{font-size:46px}.map-card{height:400px}.reels{margin-right:-18px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important}}
.map-controls{position:absolute;left:10px;top:16px;display:flex;gap:5px;z-index:4}.map-controls button{min-height:44px;border:1px solid var(--border);background:var(--white);color:var(--muted);font:600 12px Karla;padding:0 10px;cursor:pointer}.country-stamps{flex-direction:column;gap:0;right:10px;bottom:10px}.stamp{width:62px;height:62px;margin:0;margin-top:-18px}.stamp-country{font-size:8px;letter-spacing:.03em}.reel-place{flex:0 0 auto;height:auto;min-height:20px;max-height:none;font-size:22px}.reel-spot{font:500 14px/1.15 Caveat;color:var(--muted)}.reel-caption{height:60px;flex-basis:60px}.map-label{stroke-width:3px}.town-dot:focus{outline:none}.town-dot:focus circle{stroke:#B4472E}.title{font-size:46px}
</style>
</head>
<body>
<main>
<header class="masthead"><p class="eyebrow">NICO VALE</p><h1 class="title">Places with Nico</h1><p class="tagline">wherever the season looks good.</p></header>
<section class="map-card" aria-label="Travel journal map">
  <span class="tape tape-left" aria-hidden="true"></span><span class="tape tape-right" aria-hidden="true"></span>
  <div class="map-stage"><svg id="map" class="map" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Places map"></svg></div>
  <p id="journey-note" class="journey-note" hidden>Places will appear here soon.</p>
  <div class="map-controls"><button id="fit-map" type="button">All places</button><button id="europe-map" type="button">Europe</button></div>
  <div id="country-stamps" class="country-stamps" aria-label="Countries visited"></div>
  <aside id="map-note" class="map-note" aria-live="polite" aria-label="Travel journal note" hidden><button id="note-close" class="note-close" type="button" aria-label="Close note">×</button><div id="note-content"></div></aside>
</section>
<p id="stats" class="stats" hidden></p>
<section aria-labelledby="reels-title"><div class="reels-heading"><h2 id="reels-title" class="reels-title">Recent reels</h2><p class="swipe">swipe →</p></div><div id="reels" class="reels" aria-label="All posted reels"></div><p id="reels-empty" class="reels-empty" hidden>Reels will appear here after they are posted.</p></section>
<footer>Nico Vale is an AI character. The places are real. Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap contributors</a>.</footer>
</main>
<script>
'use strict';
const NS='http://www.w3.org/2000/svg';
const svgEl=(tag,attrs={})=>{const node=document.createElementNS(NS,tag);for(const [key,value] of Object.entries(attrs))node.setAttribute(key,String(value));return node;};
const stayLinks={};
function safeUrl(value){try{const u=new URL(value);return u.protocol==='https:'&&u.hostname==='www.instagram.com'&&/^\/(reel|p)\/[A-Za-z0-9_-]+\/?$/.test(u.pathname)?u.href:null}catch{return null}}
function showNote(records){const content=document.getElementById('note-content');content.replaceChildren();const title=document.createElement('h3');title.className='note-title';title.textContent=`${records[0].place} · ${records.length} ${records.length===1?'reel':'reels'}`;content.append(title);for(const post of records){const entry=document.createElement('div');entry.className='note-entry';const spot=document.createElement('p');spot.className='note-spot';spot.textContent=post.spot;const loc=document.createElement('p');loc.className='note-place';loc.textContent=`${post.place}, ${post.country}`;entry.append(spot,loc);const url=safeUrl(post.post_url);if(url){const link=document.createElement('a');link.className='note-link';link.href=url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Watch the reel →';entry.append(link)}content.append(entry)}const slug=stayLinks[records[0].place.toLowerCase()];if(slug){const link=document.createElement('a');link.className='note-link';link.href=`${slug}/`;link.textContent=`Where to stay in ${records[0].place} →`;content.append(link)}document.getElementById('map-note').hidden=false;document.getElementById('note-close').focus({preventScroll:true})}
function addStamps(posts){const countries=[...new Set(posts.map(p=>p.country))].slice(0,4);for(const [i,country]of countries.entries()){const stamp=document.createElement('div');stamp.className='stamp';stamp.style.zIndex=String(4-i);const name=document.createElement('span');name.className='stamp-country';name.textContent=country;stamp.append(name);document.getElementById('country-stamps').append(stamp)}}
function addReels(posts,latest){const root=document.getElementById('reels');for(const [i,post]of posts.entries()){const item=document.createElement('a');item.className='reel';item.href=safeUrl(post.post_url);item.target='_blank';item.rel='noopener noreferrer';item.dataset.latest=String(post.id===latest?.id);item.setAttribute('aria-label',`Watch the reel: ${post.place}, ${post.spot}`);const cover=document.createElement('img');cover.className='cover';cover.src=`covers/post-${post.id}.webp`;cover.width=122;cover.height=168;cover.loading=i<3?'eager':'lazy';cover.alt='';const caption=document.createElement('div');caption.className='reel-caption';for(const [cls,text]of [['reel-place',post.place],['reel-spot',post.spot]]){const line=document.createElement('span');line.className=cls;line.textContent=text;caption.append(line)}const badge=document.createElement('span');badge.className='latest-badge';badge.textContent='LATEST';item.append(cover,caption,badge);root.append(item)}document.getElementById('reels-empty').hidden=posts.length>0}
function draw(data,base){const svg=document.getElementById('map'),cities=data.stops,posts=data.posts,latest=data.latest;for(const node of [...base.children])svg.append(document.importNode(node,true));let view;
const europe={x:0,y:0,w:900,h:990};
function fit(){if(!cities.length)return europe;const xs=cities.map(p=>p.x),ys=cities.map(p=>p.y);let w=Math.max(110,Math.max(...xs)-Math.min(...xs)),h=Math.max(120,Math.max(...ys)-Math.min(...ys));w+=130;h+=180;const aspect=svg.clientWidth/svg.clientHeight;if(w/h<aspect)w=h*aspect;else h=w/aspect;return{x:(Math.min(...xs)+Math.max(...xs)-w)/2,y:(Math.min(...ys)+Math.max(...ys)-h)/2,w,h}}
const markers=[];for(const city of cities){const isLatest=latest&&city.posts.some(p=>p.id===latest.id),g=svgEl('g',{class:'town-dot',role:'button',tabindex:0,'aria-label':`${city.place}, ${city.country}, ${city.posts.length} reels`,'data-latest':String(!!isLatest)});const hit=svgEl('circle',{fill:'transparent'}),marker=svgEl('circle',{fill:isLatest?'#B4472E':'#FFFDF8',stroke:isLatest?'#B4472E':'#24323F'});g.append(hit,marker);let ring;if(isLatest){ring=svgEl('circle',{fill:'none',stroke:'#B4472E'});g.append(ring)}const label=svgEl('text',{class:'map-label',fill:isLatest?'#B4472E':'#6B5B45'});label.textContent=isLatest?city.place:'';svg.append(g,label);const open=()=>showNote(city.posts);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});markers.push({city,hit,marker,ring,label})}
svg.addEventListener('click',event=>{const point=new DOMPoint(event.clientX,event.clientY).matrixTransform(svg.getScreenCTM().inverse());const nearest=[...cities].sort((a,b)=>Math.hypot(a.x-point.x,a.y-point.y)-Math.hypot(b.x-point.x,b.y-point.y))[0];if(nearest&&Math.hypot(nearest.x-point.x,nearest.y-point.y)<22*view.w/svg.clientWidth)showNote(nearest.posts)});
function setView(v){view=v;svg.setAttribute('viewBox',`${v.x} ${v.y} ${v.w} ${v.h}`);const scale=Math.min(svg.clientWidth/v.w,svg.clientHeight/v.h);for(const {city,hit,marker,ring,label}of markers){for(const circle of [hit,marker,ring].filter(Boolean)){circle.setAttribute('cx',city.x);circle.setAttribute('cy',city.y)}hit.setAttribute('r',22/scale);marker.setAttribute('r',4/scale);marker.setAttribute('stroke-width',1.3/scale);if(ring){ring.setAttribute('r',9/scale);ring.setAttribute('stroke-width',1/scale)}label.setAttribute('x',city.x+10/scale);label.setAttribute('y',city.y-8/scale);label.setAttribute('font-size',16/scale);label.style.strokeWidth=3/scale}}
document.getElementById('fit-map').onclick=()=>setView(fit());document.getElementById('europe-map').onclick=()=>setView(europe);new ResizeObserver(()=>setView(view||fit())).observe(svg);setView(fit());
const stats=document.getElementById('stats');stats.textContent=`${cities.length} places · ${new Set(posts.map(p=>p.country)).size} countries`;stats.hidden=false;addStamps(posts);addReels(posts,latest);document.getElementById('journey-note').hidden=posts.length>0;document.querySelector('.swipe').hidden=!posts.length}
async function load(){const [trailResponse,baseResponse]=await Promise.all([fetch('trail.json',{cache:'no-store'}),fetch('basemap.svg',{cache:'no-store'})]);if(!trailResponse.ok||!baseResponse.ok)throw new Error('Map files unavailable');const data=await trailResponse.json(),xml=new DOMParser().parseFromString(await baseResponse.text(),'image/svg+xml');if(xml.querySelector('parsererror'))throw new Error('Invalid base map');draw(data,xml.documentElement)}
document.getElementById('note-close').addEventListener('click',()=>{document.getElementById('map-note').hidden=true});
load().catch(()=>{document.getElementById('reels-empty').textContent='The map is temporarily unavailable.';document.getElementById('reels-empty').hidden=false;document.querySelector('.swipe').hidden=true});
</script>
</body>
</html>
