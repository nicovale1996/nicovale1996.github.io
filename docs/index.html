<body>
<main>
<header class="masthead"><p class="eyebrow">NICO VALE</p><h1 class="title">Places with Nico</h1><p class="tagline">wherever the season looks good.</p></header>
<section class="map-card" aria-label="Travel journal map">
  <div class="map-stage"><svg id="map" class="map" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Places map"></svg></div>
  <div class="map-controls"><button id="fit-map" type="button">All places</button><button id="europe-map" type="button">Europe</button></div>
  <aside id="map-note" class="map-note" aria-live="polite" aria-label="Travel journal note" hidden><button id="note-close" class="note-close" type="button" aria-label="Close note">×</button><div id="note-content"></div></aside>
</section>
<p id="stats" class="stats" hidden></p>
  <div id="country-stamps" class="country-stamps" aria-label="Countries visited"></div>
  <p id="journey-note" class="journey-note" hidden>Places will appear here soon.</p>

<section aria-labelledby="reels-title"><div class="reels-heading"><h2 id="reels-title" class="reels-title">Recent reels</h2><p class="swipe">swipe →</p></div><div id="reels" class="reels" aria-label="All posted reels"></div><p id="reels-empty" class="reels-empty" hidden>Reels will appear here after they are posted.</p></section>
<footer>Nico Vale is an AI character. The places are real. Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap contributors</a>.</footer>
</main>
<script>
'use strict';
const NS='http://www.w3.org/2000/svg';
const svgEl=(tag,attrs={})=>{const node=document.createElementNS(NS,tag);for(const [key,value] of Object.entries(attrs))node.setAttribute(key,String(value));return node;};
const stayLinks={};
function safeUrl(value){try{const u=new URL(value);return u.protocol==='https:'&&u.hostname==='www.instagram.com'&&/^\/(reel|p)\/[A-Za-z0-9_-]+\/?$/.test(u.pathname)?u.href:null}catch{return null}}
function showNote(records){const content=document.getElementById('note-content');content.replaceChildren();const title=document.createElement('h3');title.className='note-title';title.textContent=`${records[0].place} · ${records.length} ${records.length===1?'reel':'reels'}`;content.append(title);for(const post of records){const entry=document.createElement('div');entry.className='note-entry';const spot=document.createElement('p');spot.className='note-spot';spot.textContent=post.spot;const loc=document.createElement('p');loc.className='note-place';loc.textContent=`${post.place}, ${post.country}`;entry.append(spot,loc);const url=safeUrl(post.post_url);if(url){const link=document.createElement('a');link.className='note-link';link.href=url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Watch the reel →';entry.append(link)}content.append(entry)}const slug=stayLinks[records[0].place.toLowerCase()];if(slug){const link=document.createElement('a');link.className='note-link';link.href=`${slug}/`;link.textContent=`Where to stay in ${records[0].place} →`;content.append(link)}document.getElementById('map-note').hidden=false;document.getElementById('note-close').focus({preventScroll:true})}
function addStamps(posts){
  const countries=[...new Set(posts.map(p=>p.country))],target=document.getElementById('country-stamps');
  target.replaceChildren();
  const names=countries.slice(0,5);if(countries.length>5)names.push(`+${countries.length-5}`);
  for(const [i,country]of names.entries()){
    const stamp=document.createElement('div');stamp.className=i===5?'stamp stamp-more':'stamp';
    stamp.style.zIndex=String(6-i);stamp.style.transform=`rotate(${[-9,6,-5,8,-7,4][i]}deg)`;
    if(i===5)stamp.setAttribute('aria-label',`${countries.length-5} more countries`);
    const name=document.createElement('span');name.className='stamp-country';name.textContent=country;stamp.append(name);target.append(stamp);
  }
}
function addReels(posts,latest){const root=document.getElementById('reels');for(const [i,post]of posts.entries()){const item=document.createElement('a');item.className='reel';item.href=safeUrl(post.post_url);item.target='_blank';item.rel='noopener noreferrer';item.dataset.latest=String(post.id===latest?.id);item.setAttribute('aria-label',`Watch the reel: ${post.place}, ${post.spot}`);const cover=document.createElement('img');cover.className='cover';cover.src=`covers/post-${post.id}.webp`;cover.width=122;cover.height=168;cover.loading=i<3?'eager':'lazy';cover.alt='';const caption=document.createElement('div');caption.className='reel-caption';for(const [cls,text]of [['reel-place',post.place],['reel-spot',post.spot]]){const line=document.createElement('span');line.className=cls;line.textContent=text;caption.append(line)}const badge=document.createElement('span');badge.className='latest-badge';badge.textContent='LATEST';item.append(cover,caption,badge);root.append(item)}document.getElementById('reels-empty').hidden=posts.length>0}
function draw(data,base){
  const svg=document.getElementById('map'),cities=data.stops,posts=data.posts,latest=data.latest;
  for(const node of [...base.children])svg.append(document.importNode(node,true));
  const overlay=svgEl('g',{class:'map-overlay'});svg.append(overlay);
  const europe={x:0,y:0,w:900,h:990};
  let view,mode='all',zoomCities=null,targets=[],scale=1,offsetX=0,offsetY=0;
  const isLatest=city=>!!latest&&city.posts.some(p=>p.id===latest.id);
  function fitAll(){
    if(!cities.length)return europe;
    const xs=cities.map(p=>p.x),ys=cities.map(p=>p.y);
    let w=Math.max(110,Math.max(...xs)-Math.min(...xs))+130,h=Math.max(120,Math.max(...ys)-Math.min(...ys))+180;
    const aspect=svg.clientWidth/svg.clientHeight;if(w/h<aspect)w=h*aspect;else h=w/aspect;
    return{x:(Math.min(...xs)+Math.max(...xs)-w)/2,y:(Math.min(...ys)+Math.max(...ys)-h)/2,w,h};
  }
  function fitCluster(members){
    const xs=members.map(p=>p.x),ys=members.map(p=>p.y),width=svg.clientWidth,height=svg.clientHeight;
    const s=Math.min((width-160)/Math.max(1,Math.max(...xs)-Math.min(...xs)),(height-190)/Math.max(1,Math.max(...ys)-Math.min(...ys)));
    return{x:(Math.min(...xs)+Math.max(...xs))/2-width/s/2,y:(Math.min(...ys)+Math.max(...ys))/2-(height/2-15)/s,w:width/s,h:height/s};
  }
  const intersects=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
  function render(){
    if(!view)return;
    const width=svg.clientWidth,height=svg.clientHeight;
    scale=Math.min(width/view.w,height/view.h);offsetX=(width-view.w*scale)/2;offsetY=(height-view.h*scale)/2;
    svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);
    overlay.setAttribute('transform',`translate(${view.x-offsetX/scale} ${view.y-offsetY/scale}) scale(${1/scale})`);
    const focused=document.activeElement?.getAttribute('data-key');overlay.replaceChildren();
    const points=cities.map(city=>({city,x:(city.x-view.x)*scale+offsetX,y:(city.y-view.y)*scale+offsetY}));
    // Connected components at this zoom; the latest city is always a singleton.
    const remaining=points.filter(p=>!isLatest(p.city)),groups=[];
    while(remaining.length){const group=[remaining.shift()];for(let i=0;i<group.length;i++)for(let j=remaining.length-1;j>=0;j--)if(Math.hypot(group[i].x-remaining[j].x,group[i].y-remaining[j].y)<28)group.push(remaining.splice(j,1)[0]);groups.push(group)}
    groups.push(...points.filter(p=>isLatest(p.city)).map(p=>[p]));
    targets=groups.map(group=>({members:group.map(p=>p.city),x:group.reduce((n,p)=>n+p.x,0)/group.length,y:group.reduce((n,p)=>n+p.y,0)/group.length})).filter(p=>p.x>=24&&p.x<=width-24&&p.y>=24&&p.y<=height-24);
    const obstacles=targets.map(p=>({x:p.x-13,y:p.y-13,w:26,h:26}));
    // Reserve the paper tags as label obstacles.
    const matrix=svg.getScreenCTM().inverse();
    for(const element of document.querySelectorAll('.map-controls button')){
      const rect=element.getBoundingClientRect(),corners=[[rect.left,rect.top],[rect.right,rect.top],[rect.left,rect.bottom],[rect.right,rect.bottom]].map(([x,y])=>new DOMPoint(x,y).matrixTransform(matrix));
      const xs=corners.map(p=>(p.x-view.x)*scale+offsetX),ys=corners.map(p=>(p.y-view.y)*scale+offsetY);
      obstacles.push({x:Math.min(...xs)-3,y:Math.min(...ys)-3,w:Math.max(...xs)-Math.min(...xs)+6,h:Math.max(...ys)-Math.min(...ys)+6});
    }
    for(const target of targets){
      const {members,x,y}=target,cluster=members.length>1,city=members[0],current=!cluster&&isLatest(city),key=members.map(p=>p.town_key).sort().join(';');
      const g=svgEl('g',{class:cluster?'map-marker cluster-marker':'map-marker town-dot',role:'button',tabindex:0,'data-key':key,'data-count':members.length,'data-latest':String(current),'aria-label':cluster?`${members.length} places: ${members.map(p=>p.place).join(', ')}. Zoom in`:`${city.place}, ${city.country}, ${city.posts.length} reels`});
      g.append(svgEl('rect',{class:'hit-area',x:x-22,y:y-22,width:44,height:44,fill:'transparent'}));
      g.append(svgEl('rect',{class:'focus-ring',x:x-24,y:y-24,width:48,height:48,rx:8,fill:'none',stroke:'#24323F','stroke-width':2,'pointer-events':'none'}));
      g.append(svgEl('circle',{class:'pin-face',cx:x,cy:y,r:cluster?13:4,fill:current?'#B4472E':'#F8F2E6',stroke:current?'#B4472E':'#24323F','stroke-width':1.3,'pointer-events':'none'}));
      if(current)g.append(svgEl('circle',{cx:x,cy:y,r:9,fill:'none',stroke:'#B4472E','stroke-width':1,'pointer-events':'none'}));
      if(cluster){const count=svgEl('text',{x,y:y+5,'text-anchor':'middle',class:'cluster-count','pointer-events':'none'});count.textContent=members.length;g.append(count)}
      target.activate=()=>{
        if(cluster){zoomCities=members;setView(fitCluster(members),'cluster');const first=overlay.querySelector('.map-marker');first?.focus({preventScroll:true})}
        else showNote(city.posts);
      };
      g.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();target.activate()}});
      overlay.append(g);
      if(focused===key)g.focus({preventScroll:true});
    }
    // Label candidates are measured in screen pixels, in right/left/above/below order.
    for(const target of [...targets].sort((a,b)=>Number(isLatest(b.members[0]))-Number(isLatest(a.members[0])))){
      if(target.members.length!==1)continue;
      const {x,y,members:[city]}=target,label=svgEl('text',{class:'map-label','font-size':18,fill:isLatest(city)?'#B4472E':'#24323F','data-city':city.place});label.textContent=city.place;overlay.append(label);
      const bounds=label.getBBox(),w=bounds.width,h=bounds.height;
      const candidates=[{x:x+17,y:y-h/2},{x:x-17-w,y:y-h/2},{x:x-w/2,y:y-18-h},{x:x-w/2,y:y+18}];
      const position=candidates.find(p=>p.x>=7&&p.y>=7&&p.x+w<=width-7&&p.y+h<=height-7&&!obstacles.some(o=>intersects({x:p.x-3,y:p.y-3,w:w+6,h:h+6},o)));
      if(position){label.setAttribute('x',position.x-bounds.x);label.setAttribute('y',position.y-bounds.y);obstacles.push({x:position.x-3,y:position.y-3,w:w+6,h:h+6})}else label.setAttribute('visibility','hidden');
    }
  }
  function setView(next,nextMode){view=next;mode=nextMode;document.getElementById('map-note').hidden=true;document.getElementById('fit-map').setAttribute('aria-pressed',String(mode==='all'));document.getElementById('europe-map').setAttribute('aria-pressed',String(mode==='europe'));render()}
  // Resolve overlapping invisible targets to the closest visible marker.
  svg.addEventListener('click',event=>{const world=new DOMPoint(event.clientX,event.clientY).matrixTransform(svg.getScreenCTM().inverse()),x=(world.x-view.x)*scale+offsetX,y=(world.y-view.y)*scale+offsetY;const target=targets.filter(p=>Math.abs(p.x-x)<=22&&Math.abs(p.y-y)<=22).sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y))[0];target?.activate()});
  document.getElementById('fit-map').onclick=()=>setView(fitAll(),'all');document.getElementById('europe-map').onclick=()=>setView(europe,'europe');
  const stats=document.getElementById('stats');stats.textContent=`${cities.length} places · ${new Set(posts.map(p=>p.country)).size} countries`;stats.hidden=false;addStamps(posts);addReels(posts,latest);document.getElementById('journey-note').hidden=posts.length>0;document.querySelector('.swipe').hidden=!posts.length;
  new ResizeObserver(()=>{view=mode==='all'?fitAll():mode==='europe'?europe:fitCluster(zoomCities);render()}).observe(svg);
  setView(fitAll(),'all');document.fonts.ready.then(render);
}
async function load(){const [trailResponse,baseResponse]=await Promise.all([fetch('trail.json',{cache:'no-store'}),fetch('basemap.svg',{cache:'no-store'})]);if(!trailResponse.ok||!baseResponse.ok)throw new Error('Map files unavailable');const data=await trailResponse.json(),xml=new DOMParser().parseFromString(await baseResponse.text(),'image/svg+xml');if(xml.querySelector('parsererror'))throw new Error('Invalid base map');draw(data,xml.documentElement)}
document.getElementById('note-close').addEventListener('click',()=>{document.getElementById('map-note').hidden=true});
load().catch(()=>{document.getElementById('reels-empty').textContent='The map is temporarily unavailable.';document.getElementById('reels-empty').hidden=false;document.querySelector('.swipe').hidden=true});
</script>
